apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-assistant-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: shop-assistant-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/shop-assistant
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/shop-assistant
        property: DB_PASSWORD
    # Per-pair RS256 for shop-assistant -> payments-microservice
    # (svc-shop-assistant--payments-microservice@internal.alfares.cz).
    # Replaces static PAYMENT_API_KEY / X-API-Key outbound auth.
    - secretKey: SHOP_ASSISTANT_TO_PAYMENTS_TOKEN
      remoteRef:
        key: secret/prod/shop-assistant
        property: SHOP_ASSISTANT_TO_PAYMENTS_TOKEN
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/shop-assistant
        property: PAYMENT_APPLICATION_ID
    - secretKey: AI_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/shop-assistant
        property: AI_SERVICE_TOKEN
